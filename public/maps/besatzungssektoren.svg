  <path d="M440 690 570 530 650 495 765 590 735 735 565 770Z" fill="#a7b984" stroke="#262925" stroke-width="8"/>
  <path d="M525 125 870 90 1090 220 1125 510 940 690 750 735 770 590 655 490 570 530 515 395 585 270Z" fill="#c78178" stroke="#262925" stroke-width="8"/>
  <path d="M515 395 585 270 705 300 745 420 655 490 570 530Z" fill="#d7cfbd" stroke="#262925" stroke-width="6"/>
  <g font-family="Arial, sans-serif" fill="#20231f" text-anchor="middle">
