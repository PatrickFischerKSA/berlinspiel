    <text x="300" y="520" font-size="34" font-weight="700">BRITISCH</text>
    <text x="610" y="675" font-size="34" font-weight="700">AMERIKANISCH</text>
    <text x="890" y="390" font-size="42" font-weight="700">SOWJETISCH</text>
